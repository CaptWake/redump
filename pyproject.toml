[project]
name = "redump"
dynamic = ["version"]
description = "Extract every function from a binary with IDA, radare2, Ghidra, or dncil"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "CaptWake" },
]
keywords = [
    "binary-analysis",
    "ghidra",
    "ida",
    "malware-analysis",
    "radare2",
    "reverse-engineering",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "rich>=15.0.0",
    "rich-argparse>=1.7.0",
]

[project.urls]
Homepage = "https://github.com/CaptWake/redump"
Repository = "https://github.com/CaptWake/redump.git"
Issues = "https://github.com/CaptWake/redump/issues"

[project.optional-dependencies]
# Each backend pulls only what it needs. Pick what matches your tooling:
#   uv sync --extra radare2     (also needs the radare2 binary on PATH)
#   uv sync --extra ghidra      (also needs GHIDRA_INSTALL_DIR set)
#   uv sync --extra dotnet      (.NET / CIL disassembly, no external tool)
# IDA's `idalib` ships with IDA Pro and is not installable from PyPI.
radare2 = ["r2pipe>=1.8.0"]
ghidra = ["pyghidra>=2.0.0"]
dotnet = ["dnfile>=0.15.0", "dncil>=1.0.0"]
all = ["redump[dotnet,ghidra,radare2]"]

[project.scripts]
redump = "redump.main:main"

[dependency-groups]
dev = [
    "build>=1.2.0",
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.6",
    "twine>=6.0.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "redump/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["redump"]

[tool.hatch.build.targets.sdist]
include = [
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/redump",
    "/scripts",
    "/tests",
]

# --- uv ----------------------------------------------------------------------
[tool.uv]
package = true

# --- ruff --------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py310"
src = ["redump", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "ANN",  # flake8-annotations
    "PLC",  # pylint conventions (import placement, etc.)
    "RUF",  # ruff-specific
]
ignore = [
    "ANN401",  # Any is unavoidable for untyped backend handles
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]  # test bodies don't need full annotations

# --- mypy --------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
strict = true
files = ["redump"]
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]

# The backend SDKs are either not pip-installable (IDA) or unstubbed (r2pipe,
# pyghidra, the in-JVM `ghidra` package). Don't fail type-checking over them.
[[tool.mypy.overrides]]
module = [
    "r2pipe",
    "pyghidra",
    "idapro",
    "ida_hexrays",
    "ida_funcs",
    "idautils",
    "idc",
    "ghidra.*",
    "dnfile",
    "dnfile.*",
    "dncil.*",
]
ignore_missing_imports = true
